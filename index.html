<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="Dmitrii Titaev">
    <title>Software Shortcuts Pro</title>
    <style>
        :root { --bg-main: #0b0f19; --bg-panel: #0d1321; --bg-card: #131c2f; --border-dim: #1e293b; --text-base: #64748b; --text-main: #b1b1b1; --key-bg: #1e293b; --active-bg: rgba(255,255,255,0.04); --item-hover: rgba(255,255,255,0.02); --btn-min-width: 135px; --app-color: #a78bfa; }
        [data-theme="light"] { --bg-main: #f8fafc; --bg-panel: #ffffff; --bg-card: #ffffff; --border-dim: #cbd5e1; --text-base: #64748b; --text-main: #434343; --key-bg: #f1f5f9; --active-bg: rgba(0,0,0,0.03); --item-hover: rgba(0,0,0,0.02); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: Tahoma, "MS Sans Serif", sans-serif; font-weight: normal; display: flex; height: 100vh; height: 100dvh; overflow: hidden; font-size: 12px; -webkit-font-smoothing: none; text-rendering: crispEdges; transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-base); }
        .sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border-dim); display: flex; flex-direction: column; padding: 11px 18px 60px 14px; z-index: 10; transition: background-color 0.3s, border-color 0.3s; }
        .brand-header { display: flex; justify-content: space-between; align-items: baseline; height: 16px; margin-bottom: 15px; padding: 0 11px 0 5px; }
        .brand { font-size: 16px; line-height: 16px; color: var(--text-main); font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }
        .lang-switch { display: flex; gap: 6px; font-size: 16px; line-height: 16px; letter-spacing: 1px; color: var(--text-base); margin-right: -2px; }
        .lang-btn { cursor: pointer; transition: color 0.2s; }
        .lang-btn:hover, .lang-btn.active { color: var(--text-main); }
        .lang-sep { opacity: 0.4; cursor: default; }
        .search-box { margin-bottom: 14px; padding: 0 11px 0 5px; }
        .search-input { width: 100%; height: 32px; background: var(--bg-main); border: 1px solid var(--border-dim); color: var(--text-main); padding: 0 10px 2px 10px; border-radius: 6px; font-family: inherit; font-size: 11px; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: var(--text-base); }
        .search-input::placeholder { color: var(--text-base); }
        .nav-list { flex: 1; overflow-y: scroll; overflow-x: hidden; display: flex; flex-direction: column; gap: 2px; padding: 0 5px; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-base); height: 32px; padding: 0 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; display: flex; align-items: center; font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-btn:hover { background: var(--item-hover); color: var(--text-main); }
        .nav-btn.active { background: var(--active-bg); border-color: var(--border-dim); color: var(--app-color); }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .nav-left > span { position: relative; top: -1px; }
        .logo-box { font-weight: normal; font-size: 11px; letter-spacing: 0; color: inherit; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; line-height: 1; border: 1px solid currentColor; border-radius: 4px; transition: opacity 0.2s; opacity: 0.8; box-sizing: border-box; padding-bottom: 2px; } 
        .nav-btn:hover .logo-box, .nav-btn.active .logo-box { opacity: 1; }
        .sidebar-bottom { margin-top: auto; padding-top: 15px; display: flex; flex-direction: column; gap: 15px; position: relative; left: 2px; }
        .theme-switch-wrapper { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 2px; padding: 13px 5px 0 5px; border-top: 1px solid var(--border-dim); color: var(--text-base); }
        .theme-label { text-align: center; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: color 0.3s; user-select: none; line-height: 1; }
        .label-light { position: relative; left: 2px; }
        .label-dark { position: relative; left: -1px; }
        [data-theme="light"] .label-light { color: var(--text-main); }
        [data-theme="light"] .label-dark { color: var(--text-base); }
        [data-theme="dark"] .label-light { color: var(--text-base); }
        [data-theme="dark"] .label-dark { color: var(--text-main); }
        .theme-pill { width: 38px; height: 20px; border: 2px solid var(--text-base); border-radius: 10px; position: relative; cursor: pointer; transition: border-color 0.3s; }
        .theme-circle { width: 12px; height: 12px; background: var(--text-base); border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: transform 0.3s, background 0.3s; transform: translateX(18px); }
        [data-theme="light"] .theme-circle { transform: translateX(0px); }
        .author-credit { align-self: center; text-align: center; font-size: 9px; color: var(--text-base); letter-spacing: 0.4px; text-transform: uppercase; opacity: 0.5; transition: opacity 0.3s, color 0.3s; user-select: none; text-decoration: none; line-height: 1; transform: translateY(-3px); }
        .author-credit:hover { opacity: 1; color: var(--text-main); }
        .main { flex: 1; padding: 11px 29px 30px 29px; overflow-y: scroll; position: relative; transition: background-color 0.3s; -webkit-overflow-scrolling: touch; }
        .header { position: relative; display: block; height: 16px; margin-bottom: 15px; padding-bottom: 0; border-bottom: none; box-sizing: border-box; }
        .header-left { position: absolute; top: 0; left: 0; display: flex; align-items: baseline; gap: 20px; height: 16px; }
        .header-title { font-size: 16px; line-height: 16px; font-weight: normal; color: var(--current-color); text-transform: uppercase; letter-spacing: 1px; }
        .os-switch { font-size: 16px; line-height: 16px; letter-spacing: 1px; color: var(--current-color); display: flex; gap: 6px; }
        .os-btn { cursor: pointer; opacity: 0.4; transition: opacity 0.2s; }
        .os-btn:hover, .os-btn.active { opacity: 1; }
        .os-switch.static .os-btn { opacity: 1; cursor: default; }
        .os-sep { opacity: 0.4; cursor: default; }
        .header-meta { position: absolute; top: 16px; left: 0; font-size: 10px; color: var(--text-base); letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; opacity: 0.8; transition: opacity 0.2s, color 0.2s; font-weight: normal; text-align: left; white-space: nowrap; }
        .header-meta a { color: inherit; text-decoration: none; transition: color 0.2s; }
        .header-meta a:hover { color: var(--text-main); opacity: 1; }
        .grid { display: flex; gap: 15px; align-items: flex-start; width: 100%; } 
        .grid-col { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 0; } 
        .category { background: var(--bg-card); border: 1px solid var(--current-color); border-radius: 6px; transition: background-color 0.3s; overflow: hidden; margin-bottom: 0; min-width: 0; }
        .cat-title { display: flex; align-items: center; justify-content: space-between; height: 31px; padding: 0 14px; font-weight: normal; color: var(--current-color); border-bottom: 1px solid var(--border-dim); background: var(--active-bg); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; cursor: pointer; user-select: none; position: relative; min-width: 0; }
        .cat-name { flex: 1; padding-right: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; position: relative; top: -1px; }
        .cat-title::after { content: ''; position: absolute; right: 14px; top: 50%; margin-top: -4px; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform 0.3s ease; }
        .category.collapsed .cat-title { height: 30px; border-bottom: none; }
        .category.collapsed .cat-title::after { transform: rotate(-45deg); }
        .category.collapsed .cat-content { display: none; }
        .item { position: relative; display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 14px; border-bottom: 1px solid var(--border-dim); transition: background 0.2s; min-width: 0; }
        .item:hover { background: var(--item-hover); }
        .item:last-child { border-bottom: none; }
        .item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background-color: var(--current-color); opacity: 0; transition: opacity 0.2s; }
        .item:hover::before { opacity: 1; }
        .item-desc { flex: 1; padding-right: 15px; color: var(--text-main); min-width: 0; display: flex; align-items: center; gap: 8px; }
        .item-desc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .item-icon { flex-shrink: 0; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-base); transition: color 0.2s; }
        .item:hover .item-icon { color: var(--text-main); }
        .item-icon svg, .item-icon .iconify { width: 100%; height: 100%; display: inline-block; color: currentColor; }
        .item-icon > svg:not([class]) { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .item-icon-space { width: 11px; flex-shrink: 0; display: block; }
        .item-shortcuts { display: flex; gap: 8px; flex-shrink: 0; }
        .item-keys { width: max-content; min-width: var(--btn-min-width); height: 20px; color: var(--text-main); background: var(--key-bg); border: 1px solid var(--border-dim); padding: 0 8px; border-radius: 4px; font-weight: normal; white-space: nowrap; font-size: 11px; cursor: pointer; transition: color 0.2s, border-color 0.2s; display: flex; align-items: center; justify-content: center; }
        .item-keys:hover { border-color: var(--current-color); color: var(--current-color); }
        .setting-val { width: auto; min-width: var(--btn-min-width); background: transparent; font-size: 11px; }
        .fav { width: 20px; flex-shrink: 0; background: none; border: none; color: var(--border-dim); cursor: pointer; font-size: 15px; text-align: right; line-height: 1; transition: color 0.2s; position: relative; z-index: 2; margin-left: 8px; }
        .fav:hover { color: var(--text-main); }
        .fav.active { color: var(--current-color); }
        .dvr-ui { padding: 14px; font-family: inherit; }
        .dvr-top { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-dim); justify-content: center; }
        .dvr-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .dvr-tab { flex: 1; text-align: center; padding: 6px 12px; cursor: pointer; color: var(--text-base); border: 1px solid var(--border-dim); border-radius: 4px; transition: all 0.2s; font-weight: normal; letter-spacing: 0.5px; }
        .dvr-tab:hover { background: var(--item-hover); color: var(--text-main); }
        .dvr-tab.active { border-color: var(--current-color); color: var(--current-color); background: var(--active-bg); }
        .dvr-panel { display: none; }
        .dvr-panel.active { display: block; }
        .dvr-row { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .dvr-label { width: 100px; text-align: right; color: var(--text-base); }
        .dvr-val { flex: 1; background: var(--key-bg); border: 1px solid var(--border-dim); padding: 5px 8px; border-radius: 4px; color: var(--text-main); cursor: text; display: flex; align-items: center; min-height: 24px; }
        .dvr-val:hover { border-color: var(--current-color); }
        .se-flex { display: flex; gap: 20px; }
        .dvr-ctrl { display: flex; align-items: center; gap: 8px; color: var(--text-main); cursor: default; }
        .dvr-ctrl input { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1px solid var(--border-dim); background: var(--key-bg); outline: none; position: relative; display: flex; align-items: center; justify-content: center; margin: 0; transition: border-color 0.2s; }
        .dvr-ctrl input[type="radio"] { border-radius: 50%; }
        .dvr-ctrl input[type="checkbox"] { border-radius: 3px; }
        .dvr-ctrl input:checked { border-color: var(--current-color); }
        .dvr-ctrl input:checked::after { content: ''; position: absolute; background: var(--current-color); }
        .dvr-ctrl input[type="radio"]:checked::after { width: 6px; height: 6px; border-radius: 50%; }
        .dvr-ctrl input[type="checkbox"]:checked::after { width: 6px; height: 6px; border-radius: 1px; }
        .dvr-ctrl.disabled { opacity: 0.5; }
        .sa-machine { padding: 14px; display: flex; flex-direction: column; gap: 4px; }
        .sa-scroll-wrap { overflow-x: auto; padding-bottom: 5px; }
        .sa-grid { min-width: 400px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .sa-btn { height: 32px; border: 1px solid var(--border-dim); background: var(--key-bg); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-main); cursor: pointer; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; user-select: none; }
        .sa-btn.sa-head { background: transparent; border-color: transparent; color: var(--text-base); font-size: 10px; cursor: default; }
        .sa-btn.sa-head.sa-action { border-color: var(--border-dim); cursor: pointer; }
        .sa-btn.sa-head.sa-action:hover { border-color: var(--current-color); color: var(--text-main); background: var(--item-hover); }
        .sa-row { display: contents; } 
        .sa-row:not(.active) .sa-btn:not(.sa-head) { opacity: 0.4; }
        .sa-row:not(.active):hover .sa-btn:not(.sa-head) { opacity: 1; }
        .sa-row.active .sa-btn-primary { background: var(--current-color); border-color: var(--current-color); color: var(--bg-main); font-weight: bold; opacity: 1; }
        .sa-btn:hover:not(.sa-head):not(.sa-btn-primary) { border-color: var(--current-color); color: var(--current-color); }

        /* --- ТЕЛЕМЕТРИЯ (КНОПКА И МОДАЛКА) --- */
		.t-info-btn { position: absolute; left: 15px; top: 0; width: 14px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-base); cursor: pointer; transition: color 0.15s ease; pointer-events: auto; z-index: 15; transform: translateY(-1px); }
		.t-info-btn:hover { color: var(--app-color); }
		
		/* Мгновенная подсказка только для кнопки Info */
		.t-info-btn[data-t-tip]::after { content: attr(data-t-tip); position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; padding: 4px 8px; background: var(--bg-panel); border: 1px solid var(--app-color); color: var(--text-main); font-size: 10px; white-space: nowrap; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.1s ease; z-index: 100; font-family: inherit; font-weight: normal; letter-spacing: normal; text-transform: none; }
		.t-info-btn[data-t-tip]:hover::after { opacity: 1; }

        .t-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s ease; }
        .t-modal-overlay.active { display: flex; opacity: 1; }
        .t-modal { background: var(--bg-main); border: 1px solid var(--border-dim); border-radius: 8px; width: 700px; max-width: 90%; max-height: 85vh; overflow-y: auto; padding: 30px; position: relative; }
        .t-modal .t-close { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-base); transition: color 0.2s; }
        .t-modal .t-close:hover { color: var(--app-color); }
        .t-modal-title { font-size: 16px; color: var(--app-color); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
        .t-modal-desc { color: var(--text-base); font-size: 12px; margin-bottom: 25px; line-height: 1.6; }
        .t-modal .group { margin-bottom: 15px; }
        .t-modal .group-title { margin-bottom: 0; border-bottom: none; }
        .t-modal .card-body { padding: 15px; font-size: 12px; color: var(--text-main); line-height: 1.6; background: rgba(255,255,255,0.02); }
        .t-modal .card-body p { margin-top: 0; margin-bottom: 10px; }
        .t-modal .card-body p:last-child { margin-bottom: 0; }
		
        #telemetry-box {
            position: absolute;
            right: 0;
            top: 0;
            width: calc(66.666% - 5px);
            height: 16px;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        .stream-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .stream-header {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 9px;
            margin: 0;
            position: relative;
            top: 1px;
        }
        .stream-header.mouse { color: var(--text-base); }
        .stream-header.keyboard { color: var(--app-color); transition: color 0.3s ease; }
        .stat-value { font-size: 9px; font-weight: normal; opacity: 0.8; }
        
        .track { 
            height: 2px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 1px; 
            position: relative; 
            overflow: hidden; 
            margin: 0;
            top: 3px;
        }
        [data-theme="light"] .track { background: rgba(0,0,0,0.05); }
        
        .track.mouse .particle { position: absolute; top: 0; left: 0; height: 100%; width: 25px; background: var(--text-base); opacity: 0.5; border-radius: 1px; animation: mouseCrawl 3.5s cubic-bezier(0.25, 0.1, 0.25, 1) infinite; }
        .track.keyboard .particle { position: absolute; top: 0; left: 0; height: 100%; width: 50px; background: var(--app-color); box-shadow: 0 0 8px var(--app-color); border-radius: 1px; animation: keyBlast 0.4s linear infinite; transition: background 0.3s ease, box-shadow 0.3s ease; }
        .track.keyboard .particle:nth-child(2) { animation-delay: 0.15s; width: 30px; }
        .track.keyboard .particle:nth-child(3) { animation-delay: 0.25s; width: 70px; }
        
        .efficiency-badge { 
            margin: 0 15px; 
            padding: 0 8px 2px 8px;
            height: 17px;
            box-sizing: border-box;
            border: 1px solid var(--app-color); 
            border-radius: 4px; 
            color: var(--app-color); 
            font-size: 10px;  
            letter-spacing: 1px; 
            text-transform: uppercase; 
            background: color-mix(in srgb, var(--app-color) 10%, transparent); 
            white-space: nowrap; 
            transition: all 0.3s ease; 
            display: flex;
            align-items: center;
            position: relative;
            top: 2px;
            justify-content: center;
            min-width: 110px;
            /* Свойства для работы клика */
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
        }

        /* Состояния выключенной телеметрии */
        #telemetry-box.paused .efficiency-badge { opacity: 0.4; }
        #telemetry-box.paused .particle { 
            animation-play-state: paused !important; 
            opacity: 0 !important; 
            transition: opacity 0.3s ease; 
        }
        
        @keyframes mouseCrawl { 0% { left: -30px; opacity: 0; } 10% { opacity: 1; left: 20%; } 40% { left: 50%; } 60% { left: 50%; } 90% { left: 100%; opacity: 1; } 100% { left: 100%; opacity: 0; } }
        @keyframes keyBlast { 0% { left: -80px; } 100% { left: 100%; } }

        @media (max-width: 1600px) { #telemetry-box { width: calc(50% - 7.5px); } }
        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 15px; border-right: none; border-bottom: 1px solid var(--border-dim); flex: none; }
            .brand-header { margin-bottom: 15px; padding: 0; justify-content: space-between; }
            .search-box { margin-bottom: 15px; padding: 0; }
            .nav-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 0 0 5px 0; margin-bottom: 0; }
            .nav-btn { flex: 0 0 auto; padding: 8px 14px; }
            .sidebar-bottom { flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 0 0 0; margin-top: 10px; border-top: 1px solid var(--border-dim); }
            .theme-switch-wrapper { border: none; padding: 0; margin: 0; }
            .author-credit { margin: 0; transform: none; }
            .main { padding: 15px; }
            .header { height: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 15px; border-bottom: 1px solid var(--border-dim); padding-bottom: 10px; }
            .header-left { position: relative; top: auto; left: auto; display: flex; flex-direction: column; gap: 8px; height: auto; align-items: flex-start; }
            .header-meta { position: relative; top: auto; left: auto; text-align: left; align-self: flex-start; white-space: normal; }
            .grid { flex-direction: column; align-items: stretch; gap: 15px; }
            .grid-col { width: 100%; }
            .category { width: 100%; }
            .se-flex { flex-direction: column; gap: 15px; }
            .dvr-top { flex-wrap: wrap; gap: 10px; }
            #telemetry-box { display: none !important; }
        }
        @media (max-width: 600px) {
            :root { --btn-min-width: 95px; }
            .item-keys { font-size: 9px; padding: 0 6px; }
            .item-desc { padding-right: 8px; }
        }
.nav-btn:nth-child(4) .logo-box,
.nav-btn:nth-child(5) .logo-box,
.nav-btn:nth-child(9) .logo-box,
.nav-btn:nth-child(10) .logo-box,
.nav-btn:nth-child(11) .logo-box,
.nav-btn:nth-child(14) .logo-box,
.nav-btn:nth-child(15) .logo-box,
.nav-btn:nth-child(16) .logo-box,
.nav-btn:nth-child(20) .logo-box,
.nav-btn:nth-child(21) .logo-box
{
    position: relative !important;
    top: -1px !important;
    padding-bottom: 0 !important;
}
.nav-btn:nth-child(1),
.nav-btn:nth-child(2),
.nav-btn:nth-child(3),
.nav-btn:nth-child(4),
.nav-btn:nth-child(5) {
    position: relative;
    top: 4px;
}
.nav-btn:nth-child(6),
.nav-btn:nth-child(7),
.nav-btn:nth-child(8),
.nav-btn:nth-child(9),
.nav-btn:nth-child(10),
.nav-btn:nth-child(11) {
    position: relative;

  let favorites = [];
    let collapsedStates = [];

    try {
        let favData = storage.get('kb_fav_data_v2', null);
        if (favData) favorites = JSON.parse(favData);
    } catch(e) {}

    try {
        let colData = storage.get('kb_collapsed_data_v2', null);
        if (colData) collapsedStates = JSON.parse(colData);
    } catch(e) {}

    let currentApp = 'fav'; 

    // --- РЕНДЕР ИКОНОК ICONIFY ---
    function refreshIcons() {
        if (typeof Iconify !== 'undefined') {
            Iconify.scan();
        } else {
            setTimeout(refreshIcons, 50);
        }
    }
    // --------------------------- 

    function getCols() {
        if (window.innerWidth <= 1024) return 1;
        if (window.innerWidth <= 1600) return 2;
        return 3;
    }

    let currentCols = getCols();

    window.addEventListener('resize', () => {
        const newCols = getCols();
        if (newCols !== currentCols) {
            currentCols = newCols;
            const searchInput = document.getElementById('search-input').value.trim();
            if (searchInput) {
                handleSearch(searchInput);
            } else {
                renderMain(currentApp);
            }
        }
    });

    function createGridCols() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const colsCount = getCols();
        for (let i = 0; i < colsCount; i++) {
            grid.innerHTML += `<div class="grid-col" id="col-${i}"></div>`;
        }
        return colsCount;
    }

    function renderNav() {
        const nav = document.getElementById('nav');
        nav.innerHTML = '';
        nav.appendChild(createNavBtn('fav', currentLang === 'ru' ? 'ИЗБРАННОЕ' : 'FAVORITES', currentApp === 'fav', 'FV', '#ca8a04'));
        
        const sortedKeys = Object.keys(rawData).sort((a, b) => rawData[a].title.localeCompare(rawData[b].title));
        sortedKeys.forEach(key => {
            const app = rawData[key];
            nav.appendChild(createNavBtn(key, app.title, currentApp === key, app.logo, app.color));
        });
    }

    function createNavBtn(id, text, isActive, logoText, color) {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${isActive ? 'active' : ''}`;
        btn.style.setProperty('--app-color', color);
        btn.onclick = () => {
            document.getElementById('search-input').value = '';
            currentApp = id;
            renderNav();
            renderMain(id);
        };
        btn.innerHTML = `<div class="nav-left"><div class="logo-box">${logoText}</div><span>${text}</span></div>`;
        return btn;
    }

    function toggleCategory(el, catId) {
        const categoryDiv = el.parentElement;
        categoryDiv.classList.toggle('collapsed');
        if (catId) {
            const isCollapsed = categoryDiv.classList.contains('collapsed');
            const idx = collapsedStates.indexOf(catId);
            
            if (isCollapsed && idx === -1) {
                collapsedStates.push(catId);
            } else if (!isCollapsed && idx > -1) {
                collapsedStates.splice(idx, 1);
            }
            storage.set('kb_collapsed_data_v2', JSON.stringify(collapsedStates));
        }
    }

    function toggleFav(btn, event) {
        event.stopPropagation(); 
        if (typeof playSound === 'function') playSound('modifier');
        
        const strId = btn.getAttribute('data-id');
        const idx = favorites.indexOf(strId);
        const isRemoving = idx > -1;
        
        if (isRemoving) {
            favorites.splice(idx, 1);
            btn.classList.remove('active');
            btn.style.color = '';
        } else {
            favorites.push(strId);
            btn.classList.add('active');
            btn.style.color = 'var(--current-color)';
        }
        
        storage.set('kb_fav_data_v2', JSON.stringify(favorites));
        const searchVal = document.getElementById('search-input').value.trim();
        
        if (currentApp === 'fav' && !searchVal && isRemoving) {
            const itemDiv = btn.closest('.item');
            const categoryDiv = btn.closest('.category');
            if (itemDiv) itemDiv.remove();
            if (categoryDiv && categoryDiv.querySelectorAll('.item').length === 0) {
                categoryDiv.remove();
            }
        }
    }

    function copyKey(el) {
        const keyText = el.getAttribute('data-key');
        if (!keyText) return;
        navigator.clipboard.writeText(keyText).then(() => {
            const originalText = el.innerHTML;
            el.innerHTML = currentLang === 'ru' ? "Скопировано" : "Copied";
            el.style.color = "var(--current-color)";
            el.style.borderColor = "var(--current-color)";
            setTimeout(() => {
                el.innerHTML = originalText;
                el.style.color = "";
                el.style.borderColor = "";
            }, 300);
        });
    }

    function buildCategoryHTML(catId, title, itemsHtml) {
        const isCollapsed = collapsedStates.includes(catId);
        const collapsedClass = isCollapsed ? 'collapsed' : '';
        return `
            <div class="category ${collapsedClass}">
                <div class="cat-title" onclick="toggleCategory(this, '${catId}')">
                    <div class="cat-name" title="${title}">${title}</div>
                </div>
                <div class="cat-content">${itemsHtml}</div>
            </div>`;
    }

    function buildItem(appId, catEN, descRU, descEN, keysWin, keysMac, iconKey) {
        const strId = `${appId}|${catEN}|${descEN}`;
        const isFav = favorites.includes(strId);
        const activeFavStyle = isFav ? `style="color: var(--current-color);"` : '';
        
        if (keysWin === "CUSTOM_UI" || keysWin === "CUSTOM_UI_SA") {
            return currentLang === 'ru' ? descRU : descEN;
        }
        
        const isWinOnly = ['np', 'tc', 'pp'].includes(appId);
        let activeKey = keysWin;
        if (!isWinOnly && currentOS === 'mac' && keysMac !== undefined) {
            activeKey = keysMac;
        }
        
        const isSettings = (appId === 'ex' || appId === 'fm' || appId === 'fg');
        const keyClass = isSettings ? 'item-keys setting-val' : 'item-keys';
		const showStar = (appId !== 'ex' && appId !== 'fm');
        const starHtml = showStar ? `<button class="fav ${isFav ? 'active' : ''}" ${activeFavStyle} data-id="${strId}" onclick="toggleFav(this, event)">★</button>` : '';
        
        let keysHtml = `<div class="${keyClass}" data-key="${activeKey}" onclick="copyKey(this)">${activeKey}</div>`;
        const displayDesc = currentLang === 'ru' ? descRU : descEN;
        
        // УНИВЕРСАЛЬНАЯ СБОРКА ИКОНОК (ICONIFY + SVG)
        let iconHtml = '<div class="item-icon-space"></div>';
        if (iconKey && iconDB && iconDB[iconKey]) {
            let iconCode = iconDB[iconKey].trim();
            if (iconCode.startsWith('<span ') || iconCode.startsWith('<svg ')) {
                iconHtml = `<div class="item-icon">${iconCode}</div>`;
            } else {
                iconHtml = `<div class="item-icon"><svg viewBox="0 0 24 24">${iconCode}</svg></div>`;
            }
        }
        
        return `
            <div class="item">
                <div class="item-desc" title="${displayDesc}">
                    ${iconHtml}
                    <span>${displayDesc}</span>
                </div>
                <div class="item-shortcuts">${keysHtml}</div>
                ${starHtml}
            </div>`;
    }

    function handleSearch(query) {
        query = query.toLowerCase().trim();
        if (!query) {
            renderMain(currentApp);
            return;
        }
        
        const titleEl = document.getElementById('title');
        const mainArea = document.getElementById('main-area');
        mainArea.style.setProperty('--current-color', '#64748b'); 
        
        let osHtml = `<div class="os-switch"><span class="os-btn ${currentOS === 'win' ? 'active' : ''}" onclick="setOS('win')">WIN</span><span class="os-sep">/</span><span class="os-btn ${currentOS === 'mac' ? 'active' : ''}" onclick="setOS('mac')">MAC</span></div>`;
        titleEl.innerHTML = `<div class="header-left"><div class="header-title">${currentLang === 'ru' ? 'ПОИСК:' : 'SEARCH:'} ${query.toUpperCase()}</div>${osHtml}</div>`;
        
        const colsCount = createGridCols();
        let colIndex = 0;
        let hasResults = false;
        let hasSABlock = false;
        
        Object.keys(rawData).forEach(appId => {
            const app = rawData[appId];
            let itemsHtml = '';
            const isWinOnly = ['np', 'tc', 'pp'].includes(appId);
            
            app.data.forEach(cat => {
                cat[2].forEach(item => {
                    const descRU = item[0];
                    const descEN = item[1];
                    const keysWin = item[2];
                    const keysMac = item[3];
                    const displayDesc = currentLang === 'ru' ? descRU : descEN;
                    let targetKey = keysWin;
                    
                    if (!isWinOnly && currentOS === 'mac' && keysMac !== undefined) targetKey = keysMac;
                    
                    if (keysWin === "CUSTOM_UI" || keysWin === "CUSTOM_UI_SA") {
                        if (displayDesc.toLowerCase().includes(query) || app.title.toLowerCase().includes(query)) {
                            itemsHtml += `<div id="${keysWin === "CUSTOM_UI_SA" ? "sa-machine-root" : ""}"></div>`;
                            if (keysWin === "CUSTOM_UI_SA") hasSABlock = true;
                            else itemsHtml += displayDesc;
                        }
                    } else {
                        const matchDesc = displayDesc.toLowerCase().includes(query);
                        const matchKey = targetKey.toLowerCase().includes(query);
                        const matchApp = app.title.toLowerCase().includes(query);
                        if (matchDesc || matchKey || matchApp) {
                            itemsHtml += buildItem(appId, cat[1], descRU, descEN, keysWin, keysMac, item[4]);
                        }
                    }
                });
            });
            
            if (itemsHtml) {
                hasResults = true;
                const catId = `search|${appId}`;
                const isCollapsed = collapsedStates.includes(catId);
                const collapsedClass = isCollapsed ? 'collapsed' : '';
                const catHtml = `
                    <div class="category ${collapsedClass}" style="--current-color: ${app.color}; border-color: ${app.color};">
                        <div class="cat-title" style="color: ${app.color};" onclick="toggleCategory(this, '${catId}')">
                            <div class="cat-name">${app.title}</div>
                        </div>
                        <div class="cat-content">${itemsHtml}</div>
                    </div>`;
                document.getElementById(`col-${colIndex}`).innerHTML += catHtml;
                colIndex = (colIndex + 1) % colsCount;
            }
        });
        
        if (!hasResults) {
            document.getElementById('grid').innerHTML = `<div style="width:100%; color: var(--text-main);">${currentLang === 'ru' ? 'Ничего не найдено.' : 'No results found.'}</div>`;
        }
        
        if (hasSABlock) renderSAMachine();
        refreshIcons();
    }

    let isTelemetryOn = storage.get('kb_telemetry', 'on') === 'on';

    function toggleTelemetry() {
        if (typeof playSound === 'function') playSound('modifier');
        isTelemetryOn = !isTelemetryOn;
        storage.set('kb_telemetry', isTelemetryOn ? 'on' : 'off');
        const box = document.getElementById('telemetry-box');
        if (box) box.classList.toggle('paused', !isTelemetryOn);
    }

    const telemetryData = {
        'ae': { m: '65', k: '120+', s: '+85%' },
		'au': { m: '50', k: '120+', s: '+140%' },
		'ps': { m: '80', k: '100+', s: '+25%' },
		'pr': { m: '45', k: '160+', s: '+255%' },
		'av': { m: '20', k: '190+', s: '+850%' },
		'bl': { m: '35', k: '180+', s: '+415%' },
		'cc': { m: '50', k: '110+', s: '+120%' },
		'cb': { m: '35', k: '70+', s: '+100%' },
		'da': { m: '40', k: '170+', s: '+325%' },
		'fl': { m: '60', k: '90+', s: '+50%' },
		'gd': { m: '15', k: '250+', s: '+1565%' },
		'gs': { m: '25', k: '140+', s: '+460%' },
		'np': { m: '15', k: '220+', s: '+1365%' },
		'pp': { m: '15', k: '80+', s: '+435%' },
		'sa': { m: '10', k: '210+', s: '+2000%' },
		'wn': { m: '35', k: '85+', s: '+145%' },
		'tg': { m: '20', k: '180+', s: '+800%' },
		'tc': { m: '10', k: '160+', s: '+1500%' },
		'yt': { m: '20', k: '60+', s: '+200%' }
    };

    function renderMain(id) {
        const titleEl = document.getElementById('title');
        const mainArea = document.getElementById('main-area');

        if (id === 'fav') {
            mainArea.style.setProperty('--current-color', '#ca8a04');
            const metaStr = currentLang === 'ru' ? 'ОТМЕЧАЙТЕ НУЖНЫЕ КОМАНДЫ ЗВЕЗДОЧКОЙ' : 'MARK YOUR WORKFLOW SHORTCUTS';
            let osHtml = `<div class="os-switch"><span class="os-btn ${currentOS === 'win' ? 'active' : ''}" onclick="setOS('win')">WIN</span><span class="os-sep">/</span><span class="os-btn ${currentOS === 'mac' ? 'active' : ''}" onclick="setOS('mac')">MAC</span></div>`;
            titleEl.innerHTML = `<div class="header-left"><div class="header-title">${currentLang === 'ru' ? 'ИЗБРАННОЕ' : 'FAVORITES'}</div>${osHtml}</div><div class="header-meta">${metaStr}</div>`;
            
            if (!favorites.length) {
                document.getElementById('grid').innerHTML = '';
                return;
            }
            
            const colsCount = createGridCols();
            let colIndex = 0;
            let favGroups = {};
            
            favorites.forEach(strId => {
                const parts = strId.split('|');
                if(parts.length === 3) {
                    const appId = parts[0];
                    if (!favGroups[appId]) favGroups[appId] = [];
                    favGroups[appId].push(strId);
                }
            });
            
            Object.keys(favGroups).forEach(appId => {
                const app = rawData[appId];
                if (!app) return;
                let itemsHtml = '';
                favGroups[appId].forEach(strId => {
                    const [_, catEN, descEN] = strId.split('|');
                    const catData = app.data.find(c => c[1] === catEN);
                    if(catData) {
                        const itemData = catData[2].find(i => i[1] === descEN);
                        if(itemData) {
                            itemsHtml += buildItem(appId, catEN, itemData[0], itemData[1], itemData[2], itemData[3], itemData[4]);
                        }
                    }
                });
                
                if (itemsHtml) {
                    const catId = `fav|${appId}`;
                    const isCollapsed = collapsedStates.includes(catId);
                    const collapsedClass = isCollapsed ? 'collapsed' : '';
                    const catHtml = `
                        <div class="category ${collapsedClass}" style="--current-color: ${app.color}; border-color: ${app.color};">
                            <div class="cat-title" style="color:${app.color};" onclick="toggleCategory(this, '${catId}')">
                                <div class="cat-name">${app.title}</div>
                            </div>
                            <div class="cat-content">${itemsHtml}</div>
                        </div>`;
                    document.getElementById(`col-${colIndex}`).innerHTML += catHtml;
                    colIndex = (colIndex + 1) % colsCount;
                }
            }); 
            refreshIcons();
            return;
        }

        const app = rawData[id];
        mainArea.style.setProperty('--current-color', app.color);
        const isWinOnly = ['np', 'tc', 'pp'].includes(id);
        const isSettings = ['ex', 'fg'].includes(id);
        let osHtml = '';

        if (!isSettings) {
            if (isWinOnly) {
                osHtml = `<div class="os-switch static"><span class="os-btn active">WIN ONLY</span></div>`;
            } else {
                osHtml = `<div class="os-switch"><span class="os-btn ${currentOS === 'win' ? 'active' : ''}" onclick="setOS('win')">WIN</span><span class="os-sep">/</span><span class="os-btn ${currentOS === 'mac' ? 'active' : ''}" onclick="setOS('mac')">MAC</span></div>`;
            }
        }

	function openTelemetryModal() {
        if (typeof playSound === 'function') playSound('fav');
        
        let overlay = document.getElementById('t-modal-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 't-modal-overlay';
            overlay.className = 't-modal-overlay';
            overlay.onclick = (e) => { if(e.target === overlay) closeTelemetryModal(); };

            overlay.innerHTML = `
                <div class="t-modal">
                    <div class="t-close" onclick="closeTelemetryModal()">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: 2px;">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                    <div class="t-modal-title">ТЕЛЕМЕТРИЯ / МЕТРИКИ</div>
                    <div class="t-modal-desc">
                        Цифры телеметрии базируются на законе Фиттса (математической модели движений человека), биомеханике и архитектуре интерфейсов. <strong style="color: var(--text-main);">APM (Actions Per Minute)</strong> в данном контексте — это плотность осмысленных команд, а не случайные клики.
                    </div>

                    <div class="group">
                        <div class="group-title">1. Физический предел MOUSE APM</div>
                        <div class="card-body">Поиск иконки, наведение курсора и клик занимают время на визуальное подтверждение. Человек физически не может выдавать больше 60–80 точных, осмысленных действий мышью в минуту на постоянной основе, особенно если интерфейс разбросан по разным панелям и мониторам.</div>
                    </div>

                    <div class="group">
                        <div class="group-title">2. Природа KEYBOARD APM</div>
                        <div class="card-body">Клавиатура исключает визуальный поиск. Мышечная память позволяет выполнять серии команд вслепую. Профессиональная работа строится на «взрывах» (bursts) активности, где за секунду нажимается 3–4 клавиши (например, вызов инструмента, разрез, удаление со сдвигом, плейбек), что дает стабильные пиковые значения в 150–250 APM.</div>
                    </div>

                    <div class="group">
                        <div class="group-title">3. Классификация софта по паттернам взаимодействия</div>
                        <div class="card-body">
                            <p><strong style="color:var(--app-color);">Текст и Код</strong> (Notepad++, Google Docs, Story Architect): Ввод текста — чистый поток нажатий. Мышь используется только для редкой навигации. Отсюда Mouse APM ~10–15, Keyboard APM ~200–250+. Математический прирост исчисляется тысячами процентов.</p>
                            <p><strong style="color:var(--app-color);">Видеомонтаж</strong> (Avid, Premiere, DaVinci): Avid исторически создавался как клавиатурная станция, поэтому его потенциал Keyboard APM самый высокий. Premiere и DaVinci требуют гибридного подхода, но перенос JKL-навигации, динамического тримминга и работы с маркерами на левую руку дает реальный буст плотности действий в 2.5–3.5 раза (+256% — +325%).</p>
                            <p><strong style="color:var(--app-color);">Анимация и Графика</strong> (After Effects, Photoshop): Маскирование, работа в Graph Editor, ротоскопинг и рисование завязаны на курсор. Клавиатура работает преимущественно в режиме модификаторов или для вызова свойств слоев. Keyboard APM физически ограничен логикой самих задач, поэтому разрыв сокращается. Исключение — Blender, где 3D-моделирование жестко привязано к шорткатам (G, S, R).</p>
                            <p><strong style="color:var(--app-color);">Звук</strong> (FL Studio, Audition): VST-плагины имитируют аналоговое железо (кнобы, фейдеры). Взаимодействие с ними возможно только курсором. Клавиатура ускоряет нарезку клипов и транспортную панель, но не может заменить сам процесс саунд-дизайна и сведения. Прирост скорости минимален (+50% — +140%).</p>
                        </div>
                    </div>

                    <div class="group">
                        <div class="group-title">МАТЕМАТИКА SPEED</div>
                        <div class="card-body" style="display: flex; align-items: center; justify-content: space-between;">
                            <div>Параметр SPEED — это точное выражение относительного прироста плотности действий, демонстрирующее разницу пропускной способности интерфейсов.</div>
                            <div style="background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 6px; display: flex; align-items: center; margin-left: 20px; border: 1px solid var(--border-dim); white-space: nowrap;">
                                <span style="margin-right: 10px;">SPEED = </span>
                                <div style="display: flex; flex-direction: column; align-items: center;">
                                    <span style="border-bottom: 1px solid currentColor; padding: 0 5px;">K - M</span>
                                    <span style="padding: 0 5px;">M</span>
                                </div>
                                <span style="margin-left: 10px;"> × 100</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }
        
        overlay.style.display = 'flex';
        // Небольшая задержка для плавного появления (transition)
        setTimeout(() => overlay.classList.add('active'), 10);
    }
